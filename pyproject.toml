[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lex_eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=2.0",
    "duckdb>=1.0",
    "google-genai",
    "httpx>=0.27.0",
    "numpy",
    "openai",
    "pydantic",
    "python-dotenv>=1.0.0",
    "scikit-learn",
    "streamlit>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["lex_eval/tests"]
markers = [
    "unit: unit tests for the lex_eval harness itself (capture, DB, gather) — fast, offline, no LLM",
]
